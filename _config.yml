title: NCM 30
preposition: at
description: >-
  The 30th Nordic Congress of Mathematicians, June 20-23 2027
baseurl: "/ncm30-website" # the subpath of your site, e.g. /blog
url: "https://islenskastaerdfraedafelagid.github.io/" # the base hostname & protocol for your site, e.g. https://example.com


# Build settings
markdown: kramdown
sass:
  style: compressed

# Additional exclude from processing
exclude:
  - vendor
  - .github/
  - README.md
  - LICENSE.md
  - REDISTRIBUTED.md
  - purgecss.config.js

# Collections and their defaults
collections:
  talks:
    output: true
    permalink: /:collection/:title/
  speakers:
    output: true
    permalink: /:collection/:title/
  rooms:
    output: true
    permalink: /:collection/:title/

defaults:
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
  - scope:
      path: ""
      type: speakers
    values:
      layout: speaker
  - scope:
      path: ""
      type: rooms
    values:
      layout: room


conference:

  # Language
  lang: en

  # Timezone
  tz: "+02:00"

  # Show theme errors:
  show_errors: False

  # Navigation bar
  navigation:
    #logo:
      #name: NCM30
      ## img: ''
      #url: 'https://digitale-gesellschaft.ch/'
    breakpoint: md
    links:
      - name: Program
        relative_url: /program/
      - name: Speakers
        relative_url: /speakers/
      - name: Parallel sessions
        relative_url: /sessions/
      - name: Venues
        relative_url: /location/
      - name: Practical information
        relative_url: /info/
      - name: Registration
        relative_url: /registration/
      
      

  # Link Preview for Sharing
  link_preview:
    # also adapt "preposition" property at top for more meaningful descriptions
    disable: false
    img:
      twitter: 'twitter_preview.png'      # inside /assets/images/
      open_graph: 'facebook_preview.png'  # inside /assets/images/

  # Main landing page
  main:
    # logo:
    #   img: ''
    #links:
      #- name: Program
        #relative_url: /program/
      #- name: How to get there
        #relative_url: /location/
      #- name: Tickets
        #disabled: true
        #absolute_url: ''

  # Live indications
  live:
    date: 01.01.2027
    timezone: GMT+0
    stop: 240 # in minutes
    streaming:
      enable: true
      pause: 60 # in minutes
      prepend: 5 # in minutes
      extend: 5 # in minutes
    demo:
      enable: false
      duration: 300 # in seconds
      pause: 10 # in seconds

  talks:
    # Talk tracks
    tracks:
      #- name: Track A
        #color: info
      #- name: Track B
        #color: success
      - name: Cat A
        color: success
      - name: Cat B
        color: success

    # Talk tags
    tags:
      - name: No recording
        icon: video-slash

    # Hide icons on talk overview page
    hide_link_icons: false

  speakers:
    # Show first and last name
    show_firstname: true

  location:
    # Disable links to locations
    hide: false
    # URL of location / room overview page
    url: '/location'
    # Main page title shown on location/room navigation bar
    navbar_title: 'Location'
    # Show map on location main page.  Set `map: false` if you don't want to
    # display it.
    map:
      # Initial map center point
      home_coord: 65.68556016422491, -18.121590340483102
      # Alternative map providers can be found on https://leaflet-extras.github.io/leaflet-providers/preview/
      # The following do match the Bootstrap design not too badly:
      #   - Thunderforest.Neighbourhood
      #   - Esri.WorldTopoMap
      map_provider: "OpenStreetMap.Mapnik"
      default_zoom: 15


  program:
    # URL of program page
    url: '/program'

    # Time steps in program table
    time_steps: 15 # in minutes

    # Show intermediary time steps (next to full hours)
    show_alltimes: true




